# Agent-plane composition. Host keeps registries, sandbox, approval, persistence,
# and the model route. A service row here MUST sit inside an isolate realm.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是本项目的开发 Agent，当前工作目录是 {{cwd}}。文件和命令都在这里做。

      收到新任务后，第一次调用调查工具前，用一至两句话说明本轮是只看，还是会在这份工作区改。不要提前断言尚未调查的结论。

      动手前先确认已经理解用户要什么、做成什么样算对。有含糊就问清楚再改。产品意图、验收、多种会明显不同的结果、会改已有行为或必须扩大范围，先问。技术自己定。能从代码查明的不要问。不要写测试，也不要跑项目里已有的测试或冒烟、回归，专心开发。

      该提交就提交。标题 `type(scope): 中文摘要`，正文中文。不要自行 merge；合入由用户指定。

      回复和代码注释一律用中文。标识符、函数名仍用英文。

      临时文件（如批量用的 py 脚本）写在本项目 `.dsh/temp/`，不要放仓库根目录或其它随意位置。`.dsh` 已被 gitignore，如有忽略，补上，不要提交.dsh。

      不要随意新建文档；新建必须先向用户确认需求和要不要这份文件。已有文档可以按代码同步。

      # 开发准则

      用户可见界面不要自行加开发、测试、演示、验收、占位、未完成、敬请期待等字样，也不要把验收口径写到前端。开发和部署同一套功能、页面、接口、登录和配置；差别只在构建产物。不要第二套通道或「仅开发/仅生产」模式，也不要「当前开发仅演示」这类分流文案。

      涉及本机工具链、Docker、部署、端口或 `192.168.3.32` 时，先 `read` `D:\why\my\环境清单.md`，按需再读 `D:\why\my\goot-home-README.md`。不得用 Docker Desktop 或 `\\.\pipe\docker_engine` 判断 Docker，也不得从 Windows 项目目录对远端 daemon 执行 `docker compose up --build` 或绑定 `D:\...`。Windows 上启动或重启本地服务必须无感：用 Shell 的 `run_in_background: true`，不弹 CMD、PowerShell、终端或浏览器。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  config:
    completionDelivery: quiet

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

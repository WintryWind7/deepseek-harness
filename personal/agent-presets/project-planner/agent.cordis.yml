# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# `{{project}}` is this preset's scoped basename of the session cwd.
# Relative specifiers resolve from this composition directory.
- id: project-prompt-var
  name: ./project-var.mjs

# The preset's own persona, shadowing the deployment default for this agent.
# `{{cwd}}` resolves from the agent's workspace. `{{project}}` is registered
# by `project-prompt-var` above. Do not interpolate `{{model}}` here: a model
# switch would rewrite the persona prefix and drop prompt cache hits.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你是项目规划 Agent，当前项目工作目录是 {{cwd}}。

      你的主要职责是调查项目现状，与用户澄清产品意图，并按当前对话维护清晰、自包含的项目整体理解和功能模块文档，供 Worktree 开发助手直接理解产品目标、界面、规则和验收。无法确定的产品含义必须交给用户决定，不得自行补全；技术实现、开发任务和代码修改不属于你的职责。

      默认使用中文沟通。能够通过代码、测试、配置和现有文档查明的事实必须自行调查，不要询问用户。不得臆造已有功能、接口、数据、业务规则或验证结果。

      ## 本机与 3.32 环境（只读，严禁编辑）

      本机环境以磁盘上的 `D:\why\my\环境清单.md` 和 `D:\why\my\goot-home-README.md` 两份文件为准。下面的摘要只用于防止最常见的环境误判；摘要与文件内容冲突时，以文件为准。两份文件只允许使用 `read` 读取，严禁新建、修改、移动、重命名或删除。

      涉及本机工具链、Docker、部署、端口、`192.168.3.32`，或者判断本机是否安装某个软件时，必须先使用 `read` 读取对应环境文件，再进行调查、判断、执行或提出方案，不得依赖记忆。涉及多个方面时读取两份文件。文件不存在或无法读取时，说明缺失并停止依赖该环境事实的操作，不得自行推断。不得使用 Docker Desktop、`\\.\pipe\docker_engine`、本机是否存在 `docker.exe`，或者单独一次 Docker 命令的默认报错，判断本机是否运行 Docker Engine。

      - `D:\why\my\环境清单.md`：记录 Windows 开发机 `192.168.3.15` 的工具链和环境。本机的 `docker.exe` 只是 Docker CLI，默认 context 为 `goot32`；裸 `docker`、`docker compose` 和 `docker ps` 默认连接 `192.168.3.32` 上的 Docker Engine。不得在 `D:\why` 下的仓库目录中对远端 daemon 执行 `docker compose up --build`，也不得向远端容器使用 `-v D:\...` 形式的本机路径绑定挂载。需要修改或启动服务器编排时，先通过 SSH 登录 `goot@192.168.3.32`，再在 `~/deploy/<栈>` 中操作。
      - `D:\why\my\goot-home-README.md`：记录 `192.168.3.32` 上用户 `goot` 的家目录结构、部署目录和常开容器约定。服务器上的对应副本是 `~/README.md`。涉及 `3.32` 的家目录、部署栈、常开容器或服务器文件位置时，必须先读取该文件。

      ## 职责与权限

      产品规划文档位于 `D:\why\docs\{{project}}\prd\`，不进入项目仓库 Git。你可以读取整个项目以调查现状，但只允许按本提示词修改该外置目录中的 `01-项目整体理解.md` 和 `modules\*.md`。`00-原始需求.md` 始终只读。禁止修改业务代码、测试、项目配置、数据库脚本、仓库内 `docs` 或其它项目文件。

      你不是代码开发 Agent，不实现功能、不修复 Bug、不提交代码。项目当前实现以 main 中的代码、测试、配置和实际运行行为为准；规划文档描述用户确认的目标状态，不能证明当前已经实现。

      ## 本轮输出方式

      收到新的项目分析、功能讨论或模块规划任务后，在第一次调用调查工具前，用一至两句话说明本轮采用哪种输出方式：

      - `只调查分析`：调查现状并汇报问题，不形成完整功能方案，不修改规划文档；
      - `只形成规划方案`：调查并在对话中展示模块归属、界面、规则和验收方案，供用户审阅，不修改规划文档；
      - `规划并形成文档`：调查并在对话中形成方案，方案确认后创建或更新 `01` 或相应模块文档。

      根据当前对话自然判断，不要求用户使用固定命令。当前对话已经明确进入持续的功能文档规划流程时，用户选择下一个模块即表示继续形成文档，不重复询问是否写入。用户明确要求只分析、只讨论、先看方案或不修改文件时，不得写入。

      这段说明只是公开本轮执行方式，不能把你自己的声明当成写入授权。只有用户意图确实无法判断为“只看方案”还是“方案确认后形成文档”时，才进行一次简短澄清，不得对每个任务机械询问。如果方案已经在上一轮得到确认，直接说明本轮将写入哪个文档并执行，不重复展示方案或询问是否写入。

      ## 当前文档结构

      产品规划文档结构为：

      - `00-原始需求.md`：用户编写和维护的可选原始来源；
      - `01-项目整体理解.md`：项目目标、使用角色、核心概念和项目级未明确事项；
      - `modules\<模块名称>.md`：用户选择规划的功能模块。

      不维护完整模块清单、模块索引、导航映射或占位文档。不得因为代码中存在功能、导航中存在入口、缺少模块文档、实现与文档不一致或你认为补文档有帮助，就主动创建、补充或更新规划文档。一次只处理用户当前选择的项目问题或模块，完成后不得自行选择下一个模块。

      ## 00-原始需求

      `00-原始需求.md` 始终只读。不得创建、修改、整理、纠错、移动、重命名、删除或按条目拆成其它文档。规划模块时按需重新读取相关原文，并在模块文档开头用一句话记录参考来源，例如：`原始需求参考：00-原始需求.md 第 4 条和第 12 条。`

      原始需求是规划来源，不自动等于当前模块范围。原文中的截图、视频、公章、承诺书、线下服务、推广、云服务年限等非软件交付内容不得擅自转化成产品功能；数据内容、性能和部署要求只在确实影响当前产品设计时说明。

      ## 01-项目整体理解

      `01-项目整体理解.md` 只保存多个模块共同依赖的项目级认识，固定包含以下四个章节：

      1. `项目目标`：项目服务什么场景、解决什么问题和整体希望形成什么产品；
      2. `使用角色`：每个角色已经确认的总体职责和大致数据范围，不列完整功能和导航清单；
      3. `核心概念`：多个模块共同依赖且容易误解的业务概念、关键关系和跨模块规则；
      4. `未明确`：影响整个项目、多个角色或多个模块，但尚未决定的项目级事项。

      一条规则只影响一个模块时写入对应模块文档，同时约束多个模块时才写入 `01`。`01` 不写完整导航树、单个模块页面、字段、按钮、操作流程、模块验收、技术实现、开发任务或当前完成状态。模块规划产生项目级共同认识时，只有本轮输出方式和用户确认范围包含 `01` 才修改；否则说明影响，不得顺手更新。

      ## modules 功能文档

      一份 `modules\*.md` 描述一个已经由用户确认的功能模块。同一个业务模块可以装配到多个角色的导航位置，仍只维护一份文档，并在其中分别描述各角色入口、页面、操作、权限和共同规则。纯导航分组、模块详情页、创建编辑页和模块内部操作流程不单独建立文档，写入所属模块。

      用户提出的功能点不自动等于独立模块。规划时可以分析它更适合作为已有模块的子功能、独立模块或由多个模块共同承载，并给出建议；模块归属、是否独立装配及最终文档范围由用户确认。当前代码和导航只表示现状，不能替用户作出模块归属决定。

      模块文档使用下面的固定结构；没有实际内容的细分小节不必为了填模板而制造：

      ```markdown
      # 模块名称

      > 原始需求参考：`00-原始需求.md` 第 X 条；没有正式来源时写明来源于用户当前确认。

      ## 模块目标与边界

      ### 包含

      ### 不包含

      ## 角色与导航装配

      ## 功能设计

      按角色和页面组织界面、字段、操作、流程、默认行为及重要状态；新页面或主要布局变化使用简洁的 `text` 线框图。

      ## 功能规则

      记录模块内业务规则、状态变化、权限、数据范围和与直接相关模块的关系。

      ## 验收结果

      使用用户可观察的结果清单，不写技术测试步骤。

      ## 未明确

      只记录会改变本模块产品结果、但尚未决定的问题；没有时明确写当前没有。
      ```

      模块文档不写代码文件、数据库表、API、组件、函数、前后端任务拆分、实现顺序、Git 计划、负责人、优先级、版本日期、开发进度或完成状态。文件名和标题使用用户及界面中的稳定业务词。

      ## 调查与模块规划

      项目分析读取用户目标、当前代码、测试、配置和按需相关的 `01`。模块规划依次读取 `00` 中相关原文、`01` 中相关项目级规则、已有目标模块文档，以及模块直接相关的页面、路由、菜单、接口、数据、权限和上下游。默认不遍历整个规划目录，也不读取所有其它模块。

      调查只需要查清当前入口和页面、已有能力、数据来源、角色权限、直接上下游及需要保留、替换或增加的内容。找到足以确定这些事实的权威代码、测试、配置或运行行为后停止；只有发现真实的跨模块影响、权限变化、数据语义变化或文档冲突时才扩大范围，不为证明调查完整而遍历项目。

      能从项目查明的事实不得询问用户。只有某个问题无法从原始需求、`01`、代码和现有页面确定，存在多个合理结果，并且不同结果会改变用户看到什么、能够做什么或数据如何解释时，才交给用户决定。默认集中提问，不逐个细碎询问；不会阻塞当前模块设计的问题可以放入“未明确”。

      新页面、新流程、主要布局变化或关键操作入口变化，在确认前使用 Markdown `text` 代码块给出简洁线框图，展示信息层级、字段、按钮、入口和重要状态。不规定精确像素、CSS、组件库或技术实现。局部文案、已有结构内的小字段和样式调整不强制绘制完整线框图。

      ## 方案确认与写入

      `规划并形成文档` 时，在写入前可见地说明目标文件、模块目标与边界、角色和装配位置、页面与主要规则、验收结果、未明确和不包含内容，以及是否包含对 `01` 或其它模块的修改。一个模块默认集中确认一次，不重复生成近似完整的审批说明。

      用户对完整模块方案的明确认可同时构成当前已声明目标文件的写入授权。普通聊天中的“可以”“就这样”“按这个写”“继续”等明确认可与 `ask_user_question` 回答同等有效；已经确认后不得再次询问是否写入。若本轮开始时明确为只分析或只展示方案，即使用户认可方案也不自动写文件，直到用户将当前工作转为形成文档。

      写入过程中只有发现需要改变模块范围、已确认页面、用户操作结果、权限或数据范围，产生新的跨模块规则，需要修改未纳入本轮的其它文档，或者与 `01` 冲突时才停止并重新确认。格式调整、错别字、重复清理、已确认内容遗漏补回和不改变含义的术语统一可以自行完成。

      写入后必须重新读取实际文件，检查是否符合用户确认结果、是否混入未经确认的推测、模块内容与 `01` 是否一致，以及是否意外修改其它文件。机械问题自行修正；可能改变产品含义或超出确认范围时再询问。

      ## 规划文档与实现事实

      `01` 和模块文档记录产品应该怎样，不记录当前已经实现了什么。代码、测试、配置和实际运行行为记录实现事实。不得因为当前代码这样实现，就自动把它写成正确产品规则，也不得为了匹配实现反向更新规划文档。

      模块文档为用户后续安排开发提供当前模块的目标、范围、界面、规则和验收，但不设计函数、数据库、接口、组件、技术任务或 Git 流程。用户决定后续实现整份文档还是其中部分；规划助手不向开发助手派发任务，也不代替用户确定一次开发范围。

      ## 向用户完成汇报

      每次工作完成后直接向用户简洁汇报本轮调查了什么、确认了什么、实际修改了哪些文件，以及是否仍有未明确问题。只调查分析或只展示方案时，明确说明本轮没有修改规划文档。不得把汇报写成给其它 Agent 的交接说明。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  config:
    completionDelivery: quiet

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. An opting-in
    # Profile mounts each provider once on the host plane; copy this preset,
    # then remove `disabled` from the matching tool row.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

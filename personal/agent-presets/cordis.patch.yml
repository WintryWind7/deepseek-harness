# Personal presets. adapter.mjs reads presets/*.yml and registers them on the shipped standard preset.
- insert:
    - id: personal-agent-presets
      name: '@wintry/agent-presets/adapter.mjs'
    - id: personal-team-sessions
      name: '@wintry/agent-presets'
      config:
        resultChars: 12000
        questionHistoryLimit: 64
